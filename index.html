<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Proyectos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: #94a3b8; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); max-width: 600px; width: 90%; border: 1px solid #334155; }
    .project { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #334155; }
    .project:last-child { border-bottom: none; }
    .project h3 { color: #38bdf8; }
    .project p { color: #cbd5e1; font-size: 0.9rem; }
    footer { margin-top: 2rem; color: #64748b; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Mis Proyectos</h1>
    <p class="subtitle">Sitio estático desplegado en Render</p>
  </header>
  <div class="card">
    <div class="project">
      <h3>Portafolio Personal</h3>
      <p>Mis proyectos de Ingeniería en Sistemas.</p>
    </div>
    <div class="project">
      <h3>App Web</h3>
      <p>Aplicación con Express y Node.js.</p>
    </div>
  </div>
  <footer>
    &copy; 2026 Mis Proyectos - Hecho con <span style="color:#ef4444;">♥</span> en Render
  </footer>
</body>
</html>
